# ============================================
# 站点配置 —— 改完保存、推送到 GitHub 即生效
# ============================================

# 主题（不用动）
remote_theme: daattali/beautiful-jekyll

# 站点标题（显示在浏览器标签和页面顶部）
title: y+m

# 作者名（显示在页头和文章署名）
author: 姚嘉明

# 一句话描述（显示在页面顶部和搜索引擎）
description: 记录生活与学习

# 每页显示多少篇文章
paginate: 10

# GitHub Pages 需要的插件（不用动）
plugins:
  - jekyll-paginate
  - jekyll-sitemap

# ---------- 以下可选，用不上可以不管 ----------

# 部署地址
url: "https://yaojiaming-cn.github.io"

# 社交主页（会显示在页面顶部导航）
# github_username: YaoJiaming-cn

# 头像：把图片放到 assets/img/ 目录里，再取消注释
# avatar: "/assets/img/avatar.png"
